<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerro Prieto · acceso</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    color: #0f172a;
    background: #fff;
  }
  .pagina { min-height: 100vh; display: grid; grid-template-columns: 1fr; }
  .hero { display: none; position: relative; min-height: 100vh; overflow: hidden; background: #0f172a; }
  .hero img.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 78% center; }
  .hero .velo {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(2, 6, 23, .72), rgba(2, 6, 23, .18), transparent);
  }
  .pie {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 32px; color: #fff;
  }
  .pie .marca { margin: 0; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.7); }
  .pie .titulo { margin: 8px 0 0; max-width: 28rem; font-size: 24px; font-weight: 650; line-height: 1.3; }
  .lado {
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    padding: 40px 24px;
    background: linear-gradient(to bottom right, #f8fafc, #eff6ff);
  }
  .caja { width: min(28rem, 100%); margin: 0 auto; }
  .centro { text-align: center; margin-bottom: 32px; }
  .logo { height: 56px; width: auto; max-width: 100%; object-fit: contain; }
  h1 { margin: 20px 0 0; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; }
  .sub { margin: 4px 0 0; color: #64748b; font-size: 14px; }
  .reloj {
    margin-top: 16px; border: 1px solid #e2e8f0; background: rgba(255,255,255,.8);
    border-radius: 10px; padding: 10px 12px;
  }
  .reloj .fecha { margin: 0; font-size: 12px; color: #64748b; text-transform: capitalize; }
  .reloj .hora { margin: 2px 0 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .reloj .zona { color: #64748b; font-weight: 400; }
  form { display: grid; gap: 16px; }
  label { display: grid; gap: 8px; font-size: 14px; font-weight: 500; }
  input {
    width: 100%; font: inherit; color: #0f172a; background: #fff;
    border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px;
  }
  input:focus { outline: 2px solid #cbd5e1; border-color: #94a3b8; }
  button.ingresar {
    width: 100%; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: #0f172a; border: 0; border-radius: 8px; padding: 10px 16px;
  }
  button.ingresar:disabled { opacity: .6; cursor: wait; }
  .error { margin: 0; color: #dc2626; font-size: 14px; }
  .idioma {
    position: absolute; top: 16px; right: 16px; z-index: 2;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 6px 10px; font: inherit; color: #334155;
  }
  @media (min-width: 1024px) {
    .pagina { grid-template-columns: 1fr 1fr; }
    .hero { display: block; }
    .lado { padding: 40px 56px; }
  }
</style>
</head>
<body>
<select class="idioma" aria-label="Idioma">
  <option>Español</option>
</select>
<div class="pagina">
  <aside class="hero">
    <img class="foto" src="/cerroprieto/marca/login-hero.png" alt="ZGROUP — monitoreo de plantas industriales">
    <div class="velo"></div>
    <div class="pie">
      <p class="marca">ZTRACK</p>
      <p class="titulo">Plataforma de monitoreo de plantas industriales</p>
    </div>
  </aside>
  <main class="lado">
    <div class="caja">
      <div class="centro">
        <img class="logo" src="/cerroprieto/marca/logo-ztrack.png" alt="ZTRACK">
        <h1>Iniciar sesión</h1>
        <p class="sub">Acceso a la plataforma de telemetría</p>
        <div class="reloj">
          <p class="fecha" id="fecha"></p>
          <p class="hora"><span id="hora"></span> <span class="zona">· GMT-5</span></p>
        </div>
      </div>
      <form method="post" action="/login" autocomplete="on">
        <label>Usuario
          <input name="usuario" autocomplete="username" placeholder="Usuario" required autofocus>
        </label>
        <label>Contraseña
          <input name="clave" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>
        <p class="error" id="error" hidden>Usuario o contraseña incorrectos.</p>
        <button class="ingresar" type="submit">Ingresar</button>
      </form>
    </div>
  </main>
</div>
<script>
function pintarReloj() {
  const ahora = new Date();
  const opts = { timeZone: "America/Lima" };
  document.getElementById("fecha").textContent = ahora.toLocaleDateString("es-PE", {
    ...opts, weekday: "long", year: "numeric", month: "long", day: "numeric"
  });
  document.getElementById("hora").textContent = ahora.toLocaleTimeString("es-PE", {
    ...opts, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
  });
}
pintarReloj();
setInterval(pintarReloj, 1000);
const marca = new URLSearchParams(location.search).get("e");
if (marca === "1" || marca === "2") {
  const aviso = document.getElementById("error");
  aviso.hidden = false;
  if (marca === "2") aviso.textContent = "Demasiados intentos. Espere unos minutos.";
}
</script>
</body>
</html>
